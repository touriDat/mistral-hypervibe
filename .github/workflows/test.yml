name: Tests

# Workflow wird ausgelst bei:
# - Push zu main
# - Pull Requests
# - Manuell
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests ausfhren
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore

  coverage:
    name: Test Coverage prfen
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=html -v
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          fail_ci_if_error: false

  lint:
    name: Code-Qualitt prfen
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
      
      - name: Run flake8
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503
        continue-on-error: true
      
      - name: Run black (check)
        run: black --check src/ tests/ --line-length=120
        continue-on-error: true
      
      - name: Run isort (check)
        run: isort --check src/ tests/
        continue-on-error: true
      
      - name: Run mypy
        run: mypy src/ tests/ --ignore-missing-imports
        continue-on-error: true

  yaml-lint:
    name: YAML-Konfigurationen prfen
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install PyYAML
        run: pip install pyyaml
      
      - name: Validate YAML files
        run: |
          python -c "
          import yaml
          import os
          yaml_files = ['config.yaml', 'patterns.yaml', 'integrations/skills.yaml', 'integrations/mcps.yaml']
          for yf in yaml_files:
              if os.path.exists(yf):
                  try:
                      yaml.safe_load(open(yf))
                      print(f'✅ {yf}: valid')
                  except Exception as e:
                      print(f'❌ {yf}: {e}')
                      exit(1)
              else:
                  print(f'⚠️  {yf}: not found')
          "}